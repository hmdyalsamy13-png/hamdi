name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o "Yawmiyat_Offline_Complete-1.zip" -d project
          
      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          
          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على مشروع Android Gradle داخل الملف."
            exit 1
          fi
          
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          "$PWD/gradlew" assembleDebug

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yawmiyat-APK
          path: project/**/*.apk
